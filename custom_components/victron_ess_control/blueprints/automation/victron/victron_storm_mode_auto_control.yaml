blueprint:
  name: Victron Storm – Auto Control
  description: >
    Automatically sets and clears input_boolean.storm_mode from up to four
    configurable signal sources:

      Signal A (required – Solcast):
        Tomorrow's solar yield (kWh/kWp) is below the storm threshold.

      Signal B+C (optional – weather forecast):
        Precipitation probability + amount exceed thresholds, or the forecast
        weather condition is storm-typical (rainy, hail …).
        Requires a separate storm_forecast_fetch automation that writes the
        weather data into helper entities daily.

      Signal D (optional – Ecowitt):
        A binary_sensor reports active heavy rain (e.g. binary_sensor.storm_rain_active
        with delay_on 30 min).

    Activation is immediate when at least one signal is active.
    Deactivation only after a configurable stabilisation delay (default 4 h).
    The manual override boolean prevents automatic deactivation.
  domain: automation
  source_url: https://github.com/marisma-mhe/ha-victron-ess-control/blob/main/blueprints/automation/victron/victron_storm_mode_auto_control.yaml

  input:

    # ═══ Required: Solcast (Signal A) ═════════════════════════════════════════

    solcast_kwh_kwp_entity:
      name: "★ Solcast – kWh/kWp tomorrow [REQUIRED]"
      description: >
        Sensor with the Solcast forecast for tomorrow, normalised to installed kWp
        (e.g. sensor.solcast_weighted_tomorrow_kwh_kWp). Always evaluated.
      selector:
        entity:
          filter:
            - domain: sensor

    storm_threshold_entity:
      name: "★ Solcast – storm threshold (input_number) [REQUIRED]"
      description: >
        Below this kWh/kWp value tomorrow is considered a storm day (Signal A).
      selector:
        entity:
          filter:
            - domain: input_number
      default: input_number.victron_storm_threshold

    # ═══ Optional: weather forecast (Signals B + C) ════════════════════════════

    use_pirateweather:
      name: "Enable weather forecast signals"
      description: >
        When on: precipitation probability, amount, and weather condition
        (Signals B+C) are included in the storm evaluation.
        Requires an instance of the victron_storm_forecast_fetch blueprint.
      selector:
        boolean: {}
      default: true

    precip_prob_helper:
      name: "Forecast – precipitation probability helper (input_number)"
      description: Populated daily by storm_forecast_fetch (0–100 %).
      selector:
        entity:
          filter:
            - domain: input_number
      default: input_number.storm_forecast_precip_prob

    precip_mm_helper:
      name: "Forecast – precipitation amount helper (input_number)"
      description: Populated daily by storm_forecast_fetch (mm).
      selector:
        entity:
          filter:
            - domain: input_number
      default: input_number.storm_forecast_precip_mm

    condition_helper:
      name: "Forecast – weather condition helper (input_text)"
      description: Populated daily by storm_forecast_fetch (condition string).
      selector:
        entity:
          filter:
            - domain: input_text
      default: input_text.storm_forecast_condition

    precip_prob_threshold_entity:
      name: "Forecast – precipitation probability threshold (input_number)"
      description: Minimum precipitation probability for Signal B (default 70 %).
      selector:
        entity:
          filter:
            - domain: input_number
      default: input_number.storm_auto_precip_probability_threshold

    precip_mm_threshold_entity:
      name: "Forecast – precipitation amount threshold (input_number)"
      description: Minimum precipitation amount for Signal B (default 3 mm).
      selector:
        entity:
          filter:
            - domain: input_number
      default: input_number.storm_auto_precip_mm_threshold

    # ═══ Optional: Ecowitt (Signal D) ═════════════════════════════════════════

    use_ecowitt:
      name: "Enable Ecowitt signal"
      description: >
        When on: a local rain binary_sensor (e.g. binary_sensor.storm_rain_active
        with delay_on 30 min) is included as Signal D in the storm evaluation.
      selector:
        boolean: {}
      default: true

    ecowitt_rain_active_entity:
      name: "Ecowitt – active rain sensor (binary_sensor)"
      description: >
        binary_sensor that is 'on' when heavy rain is active.
        Typically binary_sensor.storm_rain_active (pre-configured with
        delay_on 30 min). Only evaluated when use_ecowitt is on.
      selector:
        entity:
          filter:
            - domain: binary_sensor
      default: binary_sensor.storm_rain_active

    # ═══ Storm mode control ═══════════════════════════════════════════════════

    storm_mode_entity:
      name: Storm mode boolean (input_boolean)
      description: Set and cleared by this automation.
      selector:
        entity:
          filter:
            - domain: input_boolean
      default: input_boolean.storm_mode

    auto_enabled_entity:
      name: Auto detection enabled (input_boolean)
      description: >
        When off, this automation does not intervene.
      selector:
        entity:
          filter:
            - domain: input_boolean
      default: input_boolean.storm_mode_auto_enabled

    manual_override_entity:
      name: Manual override (input_boolean)
      description: >
        When on, storm_mode is not automatically turned off.
      selector:
        entity:
          filter:
            - domain: input_boolean
      default: input_boolean.storm_mode_manual_override

    off_delay:
      name: Stabilisation delay before deactivation
      description: >
        How long all storm signals must remain inactive before storm_mode is
        deactivated. Prevents rapid toggling.
      selector:
        duration: {}
      default: "04:00:00"

    notify_target:
      name: Notification service (empty = disabled)
      description: >
        Notify service name, e.g. notify.mobile_app_your_phone. Leave empty to disable notifications.
      selector:
        text: {}
      default: ""

# ── Blueprint variables (for template access in triggers and actions) ──────────
variables:
  _solcast: !input solcast_kwh_kwp_entity
  _threshold: !input storm_threshold_entity
  _use_pw: !input use_pirateweather
  _prob_h: !input precip_prob_helper
  _mm_h: !input precip_mm_helper
  _cond_h: !input condition_helper
  _prob_thr: !input precip_prob_threshold_entity
  _mm_thr: !input precip_mm_threshold_entity
  _use_eco: !input use_ecowitt
  _rain: !input ecowitt_rain_active_entity
  _notify: !input notify_target

triggers:
  # Template trigger storm_on: fires when at least one signal transitions false → true
  - platform: template
    value_template: >
      {% if _solcast is not defined %}{{ false }}{% else %}
      {% set sol = states(_solcast) | float(0) %}
      {% set thr = states(_threshold) | float(2.0) %}
      {% set sig_a = sol > 0 and sol < thr %}
      {% set sig_b = false %}
      {% set sig_c = false %}
      {% if _use_pw %}
        {% set prob = states(_prob_h) | float(0) %}
        {% set mm = states(_mm_h) | float(0) %}
        {% set prob_thr = states(_prob_thr) | float(70) %}
        {% set mm_thr = states(_mm_thr) | float(3) %}
        {% set sig_b = prob >= prob_thr and mm >= mm_thr %}
        {% set cond = states(_cond_h) %}
        {% set sig_c = cond in ['rainy', 'lightning-rainy', 'hail', 'pouring'] %}
      {% endif %}
      {% set sig_d = is_state(_rain, 'on') if _use_eco else false %}
      {{ sig_a or sig_b or sig_c or sig_d }}
      {% endif %}
    id: storm_on

  # Template trigger storm_off: fires after off_delay when all signals are inactive
  - platform: template
    value_template: >
      {% if _solcast is not defined %}{{ false }}{% else %}
      {% set sol = states(_solcast) | float(0) %}
      {% set thr = states(_threshold) | float(2.0) %}
      {% set sig_a = sol > 0 and sol < thr %}
      {% set sig_b = false %}
      {% set sig_c = false %}
      {% if _use_pw %}
        {% set prob = states(_prob_h) | float(0) %}
        {% set mm = states(_mm_h) | float(0) %}
        {% set prob_thr = states(_prob_thr) | float(70) %}
        {% set mm_thr = states(_mm_thr) | float(3) %}
        {% set sig_b = prob >= prob_thr and mm >= mm_thr %}
        {% set cond = states(_cond_h) %}
        {% set sig_c = cond in ['rainy', 'lightning-rainy', 'hail', 'pouring'] %}
      {% endif %}
      {% set sig_d = is_state(_rain, 'on') if _use_eco else false %}
      {{ not (sig_a or sig_b or sig_c or sig_d) }}
      {% endif %}
    for: !input off_delay
    id: storm_off

  # HA restart: synchronise state immediately
  - platform: homeassistant
    event: start
    id: ha_start

conditions:
  - condition: state
    entity_id: !input auto_enabled_entity
    state: "on"
  - condition: state
    entity_id: !input manual_override_entity
    state: "off"

actions:
  # Compute signals and reason text
  - variables:
      _sol: "{{ states(_solcast) | float(0) }}"
      _thr_val: "{{ states(_threshold) | float(2.0) }}"
      sig_a: "{{ _sol > 0 and _sol < _thr_val }}"
      sig_b: >
        {% if _use_pw %}
          {% set prob = states(_prob_h) | float(0) %}
          {% set mm = states(_mm_h) | float(0) %}
          {{ prob >= states(_prob_thr) | float(70) and mm >= states(_mm_thr) | float(3) }}
        {% else %}
          false
        {% endif %}
      sig_c: >
        {% if _use_pw %}
          {{ states(_cond_h) in ['rainy', 'lightning-rainy', 'hail', 'pouring'] }}
        {% else %}
          false
        {% endif %}
      sig_d: "{{ is_state(_rain, 'on') if _use_eco else false }}"
      storm_now: "{{ sig_a or sig_b or sig_c or sig_d }}"
      reason: >
        {% set sol = states(_solcast) | float(0) %}
        {% set thr = states(_threshold) | float(2.0) %}
        {% set parts = [] %}
        {% if sig_a %}
          {% set parts = parts + ['Solcast ' ~ sol|round(1) ~ ' kWh/kWp < ' ~ thr ~ ' threshold'] %}
        {% endif %}
        {% if sig_b %}
          {% set prob = states(_prob_h) | float(0) %}
          {% set mm = states(_mm_h) | float(0) %}
          {% set parts = parts + ['Rain ' ~ prob|round(0)|int ~ '% / ' ~ mm|round(1) ~ ' mm'] %}
        {% endif %}
        {% if sig_c %}
          {% set parts = parts + ['Condition: ' ~ states(_cond_h)] %}
        {% endif %}
        {% if sig_d %}
          {% set parts = parts + ['Heavy rain active'] %}
        {% endif %}
        {{ parts | join(' · ') or 'No storm signal' }}

  - choose:
      - conditions:
          - condition: trigger
            id: storm_on
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: !input storm_mode_entity
          - if:
              - condition: template
                value_template: "{{ _notify | length > 0 }}"
            then:
              - action: "{{ _notify }}"
                data:
                  title: Storm mode activated
                  message: "{{ reason }}"

      - conditions:
          - condition: trigger
            id: storm_off
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: !input storm_mode_entity
          - if:
              - condition: template
                value_template: "{{ _notify | length > 0 }}"
            then:
              - action: "{{ _notify }}"
                data:
                  title: Storm mode deactivated
                  message: "Weather has been calm for {{ off_delay }}."

      # HA restart: synchronise without hysteresis
      - conditions:
          - condition: trigger
            id: ha_start
        sequence:
          - if:
              - condition: template
                value_template: "{{ storm_now }}"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: !input storm_mode_entity
            else:
              - action: input_boolean.turn_off
                target:
                  entity_id: !input storm_mode_entity

mode: restart
