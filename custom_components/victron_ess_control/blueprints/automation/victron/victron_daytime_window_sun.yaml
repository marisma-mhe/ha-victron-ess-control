blueprint:
  name: Victron Daytime Window — Sunrise/Sunset
  description: >
    Sets the Victron daytime window (day_start and day_end) to today's actual
    sunrise and sunset times each day.

    Runs at a configurable time (default 00:01, when sun.sun next_rising/next_setting
    point to today's events) and optionally at HA start.

    Used by the Victron Daytime Feed-In Control blueprint to define the active
    feed-in window without hard-coding fixed times.

  domain: automation
  source_url: https://github.com/marisma-mhe/ha-victron-ess-control/blob/main/blueprints/automation/victron/victron_daytime_window_sun.yaml

  input:
    day_start_entity:
      name: Day Start Helper
      description: input_datetime to set to today's sunrise time.
      default: input_datetime.victron_day_start
      selector:
        entity:
          domain: input_datetime

    day_end_entity:
      name: Day End Helper
      description: input_datetime to set to today's sunset time.
      default: input_datetime.victron_day_end
      selector:
        entity:
          domain: input_datetime

    run_time:
      name: Daily Run Time
      description: >
        Time at which the window is updated each day. Run shortly after midnight
        (e.g. 00:01) so that sun.sun next_rising/next_setting refer to today.
      default: "00:01:00"
      selector:
        time:

    run_on_ha_start:
      name: Run on HA Start
      description: Also update the window whenever Home Assistant starts.
      default: true
      selector:
        boolean:

variables:
  _run_on_ha_start: !input run_on_ha_start

trigger:
  - platform: time
    at: !input run_time
    id: time_trigger
  - platform: homeassistant
    event: start
    id: ha_start

condition:
  - condition: or
    conditions:
      - condition: trigger
        id: time_trigger
      - condition: and
        conditions:
          - condition: trigger
            id: ha_start
          - condition: template
            value_template: "{{ _run_on_ha_start }}"

action:
  - action: input_datetime.set_datetime
    target:
      entity_id: !input day_start_entity
    data:
      time: "{{ as_timestamp(state_attr('sun.sun', 'next_rising')) | timestamp_custom('%H:%M:%S') }}"
  - action: input_datetime.set_datetime
    target:
      entity_id: !input day_end_entity
    data:
      time: "{{ as_timestamp(state_attr('sun.sun', 'next_setting')) | timestamp_custom('%H:%M:%S') }}"

mode: single
