#
# ═══════════════════════════════════════════════════════════════════════════
# Victron Daytime Solar Feed-In Control — Blueprint
# ═══════════════════════════════════════════════════════════════════════════
#
# PURPOSE
#   Controls daytime grid feed-in via AcPowerSetPoint (same MQTT topic as the
#   overnight charging blueprint, but with a negative sign).
#   MaxFeedInPower is managed by Node-RED as a hardware ceiling and is not
#   modified by this blueprint.
#
# MQTT CONTROL
#   Topic: victron_grid_system_id → Settings/CGwacs/AcPowerSetPoint
#     +W  → grid import   (overnight blueprint / charging)
#      0  → balanced      (no import, no export)
#     −W  → grid export   (this blueprint)
#
# ───────────────────────────────────────────────────────────────────────────
# HELPERS (all provided by packages/victron_ess.yaml)
# ───────────────────────────────────────────────────────────────────────────
#
# Feed-In specific:
#   input_datetime.victron_day_start                 Daytime window start       (default 07:00, set daily to sunrise)
#   input_datetime.victron_day_end                   Daytime window end         (default 21:00, set daily to sunset)
#   input_select.victron_feed_in_override            Auto / Force FeedIn / Block FeedIn
#   input_number.victron_feed_in_min_soc             Minimum SOC before feed-in         (default 80 %)
#   input_number.victron_feed_in_min_solar_remaining Minimum remaining solar today       (default 5 kWh)
#   input_number.victron_feed_in_min_surplus_w       Minimum exportable surplus          (default 500 W)
#   input_number.victron_feed_in_min_charge_w        Minimum battery charge (absolute)   (default 500 W)
#   input_number.victron_feed_in_day_charge_target_soc  Daytime full-charge target SOC   (default 100 %)
#   input_text.victron_feed_in_last_reason           Decision log                        (optional)
#
# Shared (already present):
#   input_text.victron_grid_system_id           AcPowerSetPoint topic source
#   input_number.battery_capacity_kwh           Battery capacity (kWh)
#   input_number.charge_efficiency              Charge efficiency (0.80–1.00)
#   input_number.victron_target_soc_normal      Target SOC normal — for Gate 5 forecast check (%)
#   input_number.victron_target_soc_storm       Target SOC storm — for Gate 5 forecast check (%)
#   input_number.victron_soc_floor              SOC floor (%)
#   input_boolean.storm_mode                    Storm mode active
#   sensor.victron_ess_battery_soc              Battery SOC (%)
#   sensor.victron_ess_solar_power              DC PV power (W)
#   sensor.victron_ess_consumer_system_load     AC total consumption 3-phase (W)  ← primary
#   sensor.victron_ess_battery_power            Battery power (+=charging, -=discharging, W)
#   sensor.victron_ess_grid_power               Grid power (+=import, -=export, W)
#   sensor.victron_ess_max_feed_in_power        MaxFeedInPower setting CGwacs (W)
#   sensor.solcast_weighted_remaining_today_kwh Solcast forecast remaining today (kWh)
#   sensor.predicted_remaining_consumption_kwh  Predicted remaining consumption today (kWh)
#   sensor.victron_dynamic_target_soc_now       Dynamic target SOC (0 = disabled)
#
# ───────────────────────────────────────────────────────────────────────────
# DECISION LOGIC (Auto mode, per cycle)
# ───────────────────────────────────────────────────────────────────────────
#
#  OVERRIDE (before all other checks):
#    Force FeedIn → AcPowerSetPoint = −MaxFeedInPower (Node-RED ceiling)
#    Block FeedIn → AcPowerSetPoint = 0
#
#  GATE 1 — Time window
#    Outside victron_day_start … victron_day_end → do not write
#    (Boundaries are set daily to sunrise/sunset automatically)
#
#  GATE 2 — Grid import guard
#    victron_ess_grid_power > 100 W → overnight blueprint still active, skip writing
#    100 W threshold filters measurement noise; real overnight charging is in the kW range
#
#  BYPASS — Battery full (SOC ≥ 99 %)
#    Gates 3–5 are skipped; blueprint exports immediately.
#    Replicates native ESS behaviour (export when full) that would otherwise be
#    suppressed by AcPowerSetPoint = 0.
#
#  GATE 3 — Minimum SOC
#    SOC < victron_feed_in_min_soc (default 80 %)
#    → AcPowerSetPoint = 0; battery must reach minimum SOC first
#
#  GATE 4 — Minimum remaining solar
#    solcast_remaining < victron_feed_in_min_solar_remaining (default 5 kWh)
#    → AcPowerSetPoint = 0; solar reserved for evening consumption
#
#  GATE 5 — Forecast surplus
#    surplus_kwh = solcast_remaining − remaining_consumption − battery_needed_kwh ≤ 0
#    → AcPowerSetPoint = 0; solar is fully needed for own consumption / charging
#    battery_needed_kwh: energy to reach target_soc (Normal/Storm/Dyn, at least floor)
#
#  GATE 6 — Exportable real-time surplus with charge reservation
#    Charge reservation (step 1): ensure battery reaches full by end of day
#      battery_needed_for_full_kwh = max(0, (day_charge_target_soc − SOC) × cap / eff)
#      forecast_charge_w = battery_needed_for_full_kwh × 1000 / hours_remaining
#      min_charge_reserve_w = max(forecast_charge_w, victron_feed_in_min_charge_w)
#        → forecast_charge_w: dynamic — high when battery empty and little time left
#        → victron_feed_in_min_charge_w: absolute floor (safety in bad weather)
#    Exportable surplus (step 2):
#      exportable_surplus_w = max(0, solar_now − consumption_now − min_charge_reserve_w)
#    Gate check:
#      exportable_surplus_w < victron_feed_in_min_surplus_w (default 500 W)
#      → AcPowerSetPoint = 0
#    Effect: ESS automatically throttles battery charging to min_charge_reserve_w
#    and routes the remainder (exportable_surplus_w) to the grid.
#
#  MORNING PRIORITY (optional, parallel modification of Gate 6):
#    Conditions: victron_feed_in_morning_priority = on
#                AND now() < midpoint of daytime window
#                AND surplus_kwh ≥ victron_feed_in_morning_surplus_buffer_kwh
#    Effect: min_charge_reserve_w = victron_feed_in_min_charge_w (absolute minimum only)
#    → Maximum export in the morning; battery is recharged in the afternoon
#    Decision log shows [☀️MP] when active
#
#  ALL GATES PASSED:
#    export_w = min(exportable_surplus_w, MaxFeedInPower)   ← Node-RED ceiling
#    AcPowerSetPoint = −export_w
#
# ───────────────────────────────────────────────────────────────────────────
# TRIGGERS
#   - State change real-time power: solar, consumption, battery, grid
#     → immediate re-evaluation on power change (prevents battery discharge
#       from a stale setpoint between 5-minute cycles)
#   - State change settings: SOC, Solcast, remaining consumption, override,
#     dynamic target, target SOC, storm mode, charge minimum, full-charge target
#   - Time-based: every 5 minutes (fallback for HA restarts)
#   - Exact: at daytime window start and end
#
# COORDINATION WITH OVERNIGHT BLUEPRINT
#   Both blueprints write to the same AcPowerSetPoint topic.
#   Gate 2 (grid > 100 W) ensures the overnight blueprint is not disturbed.
#   When the overnight blueprint finishes (grid ≤ 100 W), this blueprint
#   automatically takes control.
#
# ═══════════════════════════════════════════════════════════════════════════


blueprint:
  name: Victron Daytime Solar Feed-In Control
  description: >
    Controls daytime grid feed-in via AcPowerSetPoint (negative = export).
    Shares the MQTT topic with the overnight charging blueprint and coordinates
    via the grid import guard (does not write while grid import is active).

    Export = min(real-time surplus, MaxFeedInPower ceiling from Node-RED).
    MaxFeedInPower is managed by Node-RED, not by this blueprint.

    Gates (Auto): time window → grid import guard → [bypass at SOC≥99%] →
    minimum SOC → minimum remaining solar → forecast surplus → minimum real-time surplus.

    Override: Auto / Force FeedIn (Node-RED ceiling) / Block FeedIn (0 W).
  domain: automation
  source_url: https://github.com/marisma-mhe/ha-victron-ess-control/blob/main/blueprints/automation/victron/victron_daytime_feed_in_control.yaml

  input:
    # --- AcPowerSetPoint write path (shared with overnight blueprint) ---
    mqtt_topic_entity:
      name: Victron System ID (input_text, portal serial)
      description: >
        input_text containing the Victron portal serial / system ID.
        The MQTT write topic for AcPowerSetPoint is constructed from this value.
        Default: input_text.victron_grid_system_id
      selector: { entity: { filter: [ domain: input_text ] } }
      default: input_text.victron_grid_system_id

    # --- Node-RED ceiling (used only for Force FeedIn override) ---
    max_feed_in_power_entity:
      name: Node-RED MaxFeedInPower readback sensor (W)
      description: >
        Used only for Force FeedIn override. In Auto mode the export setpoint is
        always the calculated real-time surplus, never this ceiling.
        Default: sensor.victron_ess_max_feed_in_power
      selector: { entity: { filter: [ domain: sensor ] } }
      default: sensor.victron_ess_max_feed_in_power

    # --- Real-time power sensors ---
    solar_power_sensor:
      name: Current solar production (sensor, W)
      description: "Live DC PV power output. Default: sensor.victron_ess_solar_power"
      selector: { entity: { filter: [ domain: sensor ] } }
      default: sensor.victron_ess_solar_power

    consumption_power_sensor:
      name: Current AC consumption (sensor, W)
      description: "Live AC load. Default: sensor.victron_ess_consumer_system_load"
      selector: { entity: { filter: [ domain: sensor ] } }
      default: sensor.victron_ess_consumer_system_load

    battery_power_sensor:
      name: Current battery power (sensor, W)
      description: >
        Live battery power. Positive = charging, negative = discharging.
        Only the charging portion is subtracted from solar.
        Default: sensor.victron_ess_battery_power
      selector: { entity: { filter: [ domain: sensor ] } }
      default: sensor.victron_ess_battery_power

    grid_power_sensor:
      name: Grid power sensor (sensor, W)
      description: >
        Live AC grid power. Positive = importing, negative = exporting.
        When positive (grid import active) this blueprint skips writing to
        AcPowerSetPoint so the overnight blueprint keeps control.
        Default: sensor.victron_ess_grid_power
      selector: { entity: { filter: [ domain: sensor ] } }
      default: sensor.victron_ess_grid_power

    # --- Minimum SOC before feed-in starts ---
    min_soc_for_feed_in_entity:
      name: Minimum SOC for feed-in (input_number, %)
      description: >
        Battery must reach this SOC before any export is allowed.
        Ensures the battery is sufficiently charged before selling to the grid.
        Default: input_number.victron_feed_in_min_soc (80 %)
      selector: { entity: { filter: [ domain: input_number ] } }
      default: input_number.victron_feed_in_min_soc

    # --- Battery / SOC ---
    soc_sensor:
      name: Battery SOC sensor (%)
      selector: { entity: { filter: [ domain: sensor ] } }
      default: sensor.victron_ess_battery_soc

    soc_target_entity:
      name: Target SOC — normal mode (input_number, %)
      selector: { entity: { filter: [ domain: input_number ] } }
      default: input_number.victron_target_soc_normal

    storm_target_entity:
      name: Target SOC — storm mode (input_number, %)
      selector: { entity: { filter: [ domain: input_number ] } }
      default: input_number.victron_target_soc_storm

    storm_mode_entity:
      name: Storm mode flag (input_boolean)
      selector: { entity: { filter: [ domain: input_boolean ] } }
      default: input_boolean.storm_mode

    dyn_target_sensor:
      name: Dynamic target SOC sensor (0 = disabled)
      description: >
        sensor.victron_dynamic_target_soc_now — overrides normal/storm target when > 0.
      selector: { entity: { filter: [ domain: sensor ] } }
      default: sensor.victron_dynamic_target_soc_now

    soc_floor_entity:
      name: SOC floor (input_number, %)
      selector: { entity: { filter: [ domain: input_number ] } }
      default: input_number.victron_soc_floor

    battery_capacity_entity:
      name: Battery capacity (input_number, kWh)
      selector: { entity: { filter: [ domain: input_number ] } }
      default: input_number.battery_capacity_kwh

    charge_efficiency_entity:
      name: Charge efficiency (input_number, 0.80–1.00)
      description: Used to inflate the battery charge need by the round-trip loss.
      selector: { entity: { filter: [ domain: input_number ] } }
      default: input_number.charge_efficiency

    # --- Solar / Consumption forecast ---
    min_solar_remaining_entity:
      name: Minimum remaining solar for feed-in (input_number, kWh)
      description: >
        Feed-in only starts when the remaining Solcast forecast exceeds this value.
        Protects against exporting when little solar energy remains in the evening.
        Default: input_number.victron_feed_in_min_solar_remaining
      selector: { entity: { filter: [ domain: input_number ] } }
      default: input_number.victron_feed_in_min_solar_remaining

    min_surplus_w_entity:
      name: Minimum real-time surplus for feed-in (input_number, W)
      description: >
        Feed-in only starts when the instantaneous surplus (solar − consumption −
        battery charging) exceeds this value. Prevents export on measurement noise
        or very small surpluses. Default: input_number.victron_feed_in_min_surplus_w
      selector: { entity: { filter: [ domain: input_number ] } }
      default: input_number.victron_feed_in_min_surplus_w

    min_charge_power_entity:
      name: Minimum battery charge power (input_number, W)
      description: >
        Absolute floor for battery charging power during feed-in.
        Prevents the battery from receiving too little charge in bad weather,
        even when the forecast-based value would allow a lower reservation.
        Effective minimum = max(forecast-based value, this value).
        Default: input_number.victron_feed_in_min_charge_w (500 W)
      selector: { entity: { filter: [ domain: input_number ] } }
      default: input_number.victron_feed_in_min_charge_w

    day_charge_target_entity:
      name: Daytime full-charge target SOC (input_number, %)
      description: >
        Target SOC for the daytime charge-reservation calculation.
        The blueprint always reserves enough charge power to reach this SOC by end
        of day — independent of victron_target_soc_normal (overnight target).
        Default: input_number.victron_feed_in_day_charge_target_soc (100 %)
      selector: { entity: { filter: [ domain: input_number ] } }
      default: input_number.victron_feed_in_day_charge_target_soc

    morning_priority_entity:
      name: Morning Feed-In Priority (input_boolean)
      description: >
        When active + first half of day + sufficient forecast buffer:
        reduce charge reservation to the minimum floor and export immediately.
        Battery is recharged by afternoon solar.
        Default: input_boolean.victron_feed_in_morning_priority
      selector: { entity: { filter: [ domain: input_boolean ] } }
      default: input_boolean.victron_feed_in_morning_priority

    morning_surplus_buffer_entity:
      name: Minimum forecast buffer for Morning Priority (input_number, kWh)
      description: >
        Morning Priority only activates when surplus_kwh ≥ this value.
        Safety buffer against cloudy afternoons despite a good morning forecast.
        Default: input_number.victron_feed_in_morning_surplus_buffer_kwh (2 kWh)
      selector: { entity: { filter: [ domain: input_number ] } }
      default: input_number.victron_feed_in_morning_surplus_buffer_kwh

    solcast_remaining_today_sensor:
      name: Solcast remaining today (sensor, kWh)
      selector: { entity: { filter: [ domain: sensor ] } }
      default: sensor.solcast_weighted_remaining_today_kwh

    remaining_consumption_sensor:
      name: Predicted remaining consumption today (sensor, kWh)
      selector: { entity: { filter: [ domain: sensor ] } }
      default: sensor.predicted_remaining_consumption_kwh

    # --- Daytime window ---
    day_start_entity:
      name: Daytime window start (input_datetime)
      selector: { entity: { filter: [ domain: input_datetime ] } }
      default: input_datetime.victron_day_start

    day_end_entity:
      name: Daytime window end (input_datetime)
      selector: { entity: { filter: [ domain: input_datetime ] } }
      default: input_datetime.victron_day_end

    # --- Override ---
    override_select_entity:
      name: Feed-in override (input_select)
      selector: { entity: { filter: [ domain: input_select ] } }
      default: input_select.victron_feed_in_override

    # --- Debug (optional) ---
    last_reason_text:
      name: (Optional) input_text for last decision log
      default: input_text.victron_feed_in_last_reason
      selector: { entity: { filter: [ domain: input_text ] } }

mode: restart

# ---------- Variable pass-through for trigger entity_id references ----------
variables:
  mqtt_topic_entity:              !input mqtt_topic_entity
  max_feed_in_power_entity:       !input max_feed_in_power_entity
  min_soc_for_feed_in_entity:     !input min_soc_for_feed_in_entity
  min_solar_remaining_entity:     !input min_solar_remaining_entity
  min_surplus_w_entity:           !input min_surplus_w_entity
  min_charge_power_entity:        !input min_charge_power_entity
  day_charge_target_entity:         !input day_charge_target_entity
  morning_priority_entity:          !input morning_priority_entity
  morning_surplus_buffer_entity:    !input morning_surplus_buffer_entity
  solar_power_sensor:             !input solar_power_sensor
  consumption_power_sensor:       !input consumption_power_sensor
  battery_power_sensor:           !input battery_power_sensor
  grid_power_sensor:              !input grid_power_sensor
  soc_sensor:                     !input soc_sensor
  soc_target_entity:              !input soc_target_entity
  storm_target_entity:            !input storm_target_entity
  storm_mode_entity:              !input storm_mode_entity
  dyn_target_sensor:              !input dyn_target_sensor
  soc_floor_entity:               !input soc_floor_entity
  battery_capacity_entity:        !input battery_capacity_entity
  charge_efficiency_entity:       !input charge_efficiency_entity
  solcast_remaining_today_sensor: !input solcast_remaining_today_sensor
  remaining_consumption_sensor:   !input remaining_consumption_sensor
  day_start_entity:               !input day_start_entity
  day_end_entity:                 !input day_end_entity
  override_select_entity:         !input override_select_entity
  last_reason_text:               !input last_reason_text

# ---------- Triggers ----------
trigger:
  # Real-time power sensors — re-evaluate immediately when solar/load/battery changes
  - platform: state
    entity_id:
      - !input solar_power_sensor
      - !input consumption_power_sensor
      - !input battery_power_sensor
      - !input grid_power_sensor

  # Forecast / helper / override changes
  - platform: state
    entity_id:
      - !input soc_sensor
      - !input solcast_remaining_today_sensor
      - !input remaining_consumption_sensor
      - !input override_select_entity
      - !input min_charge_power_entity
      - !input day_charge_target_entity
      - !input dyn_target_sensor
      - !input soc_target_entity
      - !input storm_target_entity
      - !input storm_mode_entity
      - !input min_soc_for_feed_in_entity
      - !input min_surplus_w_entity
      - !input min_solar_remaining_entity
      - !input morning_priority_entity
      - !input morning_surplus_buffer_entity

  # Fallback poll every 5 minutes (covers HA restarts and missed triggers)
  - platform: time_pattern
    minutes: "/5"

  # Fire exactly at window boundaries
  - platform: time
    at: !input day_start_entity
  - platform: time
    at: !input day_end_entity

condition: []

action:
  # -------- 1. Compute all decision variables --------
  - variables:
      topic:     "victron/W/{{ states(mqtt_topic_entity) }}/settings/0/Settings/CGwacs/AcPowerSetPoint"
      max_power: "{{ states(max_feed_in_power_entity) | int(0) }}"

      # Real-time power (W)
      solar_w:          "{{ states(solar_power_sensor)       | float(0) }}"
      consumption_w:    "{{ states(consumption_power_sensor) | float(0) }}"
      # Only charging counts against solar; discharging already covers loads
      battery_charge_w: "{{ [states(battery_power_sensor) | float(0), 0] | max }}"
      # Raw instantaneous surplus before charge-reserve deduction (display only)
      raw_surplus_w:    "{{ (solar_w - consumption_w - battery_charge_w) | round(0) | int }}"
      min_surplus_w:    "{{ states(min_surplus_w_entity) | int(500) }}"

      # Grid import guard: >100 W = overnight blueprint actively buying from grid (not noise)
      grid_w:        "{{ states(grid_power_sensor) | float(0) }}"
      grid_importing: "{{ grid_w > 100 }}"

      # Forecast (kWh)
      solar_remaining:       "{{ states(solcast_remaining_today_sensor) | float(0) }}"
      consumption_remaining: "{{ states(remaining_consumption_sensor)   | float(0) }}"
      soc:         "{{ states(soc_sensor) | float(0) }}"
      floor:       "{{ states(soc_floor_entity) | float(20) }}"
      base_normal: "{{ states(soc_target_entity)   | float(80) }}"
      base_storm:  "{{ states(storm_target_entity) | float(90) }}"
      storm_active: "{{ is_state(storm_mode_entity, 'on') }}"
      dyn: "{{ states(dyn_target_sensor) | float(0) }}"
      cap: "{{ states(battery_capacity_entity) | float(0) }}"
      eff: "{{ states(charge_efficiency_entity) | float(0.95) }}"
      mode: "{{ states(override_select_entity) }}"
      min_soc_feed_in: "{{ states(min_soc_for_feed_in_entity) | float(80) }}"
      soc_ready: "{{ soc >= min_soc_feed_in }}"
      min_solar_remaining: "{{ states(min_solar_remaining_entity) | float(5) }}"
      solar_remaining_ok: "{{ solar_remaining >= min_solar_remaining }}"

      # Daytime window check (midnight-safe)
      inwin: >-
        {% set s = today_at(states(day_start_entity)) %}
        {% set e = today_at(states(day_end_entity)) %}
        {{ (now() >= s and now() < e) if s <= e else (now() >= s or now() < e) }}

      # Effective target SOC: dyn > 0 overrides normal/storm, always >= floor
      target_soc: >-
        {% set base = base_storm if storm_active else base_normal %}
        {% set t = dyn if dyn > 0 else base %}
        {{ [t, floor] | max }}

      # kWh still needed to reach target (accounting for charge losses)
      battery_needed_kwh: >-
        {{ ([((target_soc - soc) * cap / 100) / eff, 0] | max) | round(2) }}

      # Forecast surplus: positive = solar covers remaining own needs (uses target_soc=80%)
      surplus_kwh: >-
        {{ (solar_remaining - consumption_remaining - battery_needed_kwh) | round(2) }}

      # Morning Priority: in the first half of the day, when forecast surplus ≥ buffer,
      # reduce charge reservation to the absolute floor and export aggressively now.
      # The battery will be charged by afternoon solar at full rate.
      morning_priority_enabled: "{{ is_state(morning_priority_entity, 'on') }}"
      morning_surplus_buffer: "{{ states(morning_surplus_buffer_entity) | float(2) }}"
      in_morning: >-
        {% set s = today_at(states(day_start_entity)) %}
        {% set e = today_at(states(day_end_entity)) %}
        {% set mid = s + (e - s) / 2 %}
        {{ now() < mid }}
      morning_forecast_sufficient: "{{ surplus_kwh >= morning_surplus_buffer }}"
      morning_priority_active: "{{ morning_priority_enabled and in_morning and morning_forecast_sufficient }}"

      # Hours remaining in daytime window (minimum 0.1 to avoid division by zero)
      hours_remaining_day: >-
        {% set e = today_at(states(day_end_entity)) %}
        {{ [(e - now()).total_seconds() / 3600, 0.1] | max }}

      # kWh still needed to reach the daytime full-charge target (default 100%)
      # Used for charge reservation — independent of the overnight target_soc (80%)
      day_charge_target_soc: "{{ states(day_charge_target_entity) | float(100) }}"
      battery_needed_for_full_kwh: >-
        {{ ([((day_charge_target_soc - soc) * cap / 100) / eff, 0] | max) | round(2) }}

      # Minimum charge rate: max of forecast-based need (to reach 100%) and configured floor
      # When morning_priority_active: use only the absolute floor — defer charging to afternoon.
      min_charge_floor_w: "{{ states(min_charge_power_entity) | int(500) }}"
      min_charge_reserve_w: >-
        {% if soc >= 99 %}
          0
        {% elif morning_priority_active %}
          {{ min_charge_floor_w }}
        {% else %}
          {% set forecast_w = ([battery_needed_for_full_kwh * 1000 / hours_remaining_day, 0] | max) | int %}
          {{ [forecast_w, min_charge_floor_w] | max }}
        {% endif %}

      # Exportable surplus: solar minus consumption minus reserved battery charge share
      # This is what the blueprint actually commands — ESS automatically throttles charging
      # to the reserved rate and routes the remainder to the grid.
      exportable_surplus_w: >-
        {{ [solar_w - consumption_w - min_charge_reserve_w, 0] | max | int }}

      real_time_ok: "{{ exportable_surplus_w >= min_surplus_w }}"

      # Export power: exportable surplus capped by Node-RED MaxFeedInPower ceiling
      export_w: "{{ [exportable_surplus_w, max_power] | min | int }}"

      # Battery full: bypass forecast/min-SOC gates — ESS would export anyway at 100%
      battery_full: "{{ soc >= 99 }}"

      # max_power == 0 means Node-RED has set MaxFeedInPower to 0 (e.g. maintenance).
      # Treated as "export blocked" — neither bypass nor normal export fires.
      # All gates must pass
      feed_in_eligible: "{{ inwin and soc_ready and solar_remaining_ok and surplus_kwh > 0 and real_time_ok and not grid_importing and max_power > 0 }}"

      decision_text: >-
        {% if not topic or topic in ['unknown', 'unavailable'] %}
        ⚠️ MQTT topic missing
        {% elif mode == 'Force FeedIn' and max_power == 0 %}
        ⚠️ Force FeedIn: MaxFeedInPower = 0 (Node-RED ceiling) → no export possible
        — exportable: {{ exportable_surplus_w }} W · SOC: {{ soc|round(0) }}%
        {% elif mode == 'Force FeedIn' %}
        ✅ Export: Force FeedIn (Override) → AcPowerSetPoint = {{ -max_power }} W
        — solar_now: {{ solar_w | round(0) }} W · load_now: {{ consumption_w | round(0) }} W · batt_chg: {{ battery_charge_w | round(0) }} W · grid: {{ grid_w | round(0) }} W
        {% elif mode == 'Block FeedIn' %}
        ❌ Export: Block FeedIn (Override) → AcPowerSetPoint = 0
        {% elif not inwin %}
        ❌ Export: outside daytime window → AcPowerSetPoint unchanged
        — solar_now: {{ solar_w | round(0) }} W · raw_surplus: {{ raw_surplus_w }} W · forecast_surplus: {{ surplus_kwh | round(2) }} kWh
        {% elif grid_importing %}
        ⏸ Export: grid import active ({{ grid_w | round(0) }} W) → not writing, overnight blueprint keeps control
        — solar_now: {{ solar_w | round(0) }} W · raw_surplus: {{ raw_surplus_w }} W
        {% elif max_power == 0 %}
        ⏸ Export: MaxFeedInPower = 0 (Node-RED ceiling) → AcPowerSetPoint = 0
        — export blocked · SOC: {{ soc|round(0) }}% · exportable: {{ exportable_surplus_w }} W
        {% elif battery_full and real_time_ok %}
        ✅ Exp (full {{ soc|round(0) }}%): {{ export_w }}W AcSP={{ -export_w }}W (cap:{{ max_power }}W)
        sol:{{ solar_w|round(0) }} load:{{ consumption_w|round(0) }} surplus:{{ (solar_w - consumption_w)|round(0)|int }}W
        {% elif not soc_ready %}
        ❌ Export: SOC too low ({{ soc | round(0) }}% < {{ min_soc_feed_in | round(0) }}%) → AcPowerSetPoint = 0
        — battery charging first · forecast_surplus: {{ surplus_kwh | round(2) }} kWh
        {% elif not solar_remaining_ok %}
        ❌ Export: insufficient remaining solar ({{ solar_remaining | round(2) }} kWh < {{ min_solar_remaining | round(2) }} kWh) → AcPowerSetPoint = 0
        — solar reserved for own consumption
        {% elif surplus_kwh <= 0 %}
        ❌ Export: forecast surplus negative → AcPowerSetPoint = 0
        — solar: {{ solar_remaining | round(2) }} kWh · load: {{ consumption_remaining | round(2) }} kWh · batt_need: {{ battery_needed_kwh | round(2) }} kWh · surplus: {{ surplus_kwh | round(2) }} kWh · SOC: {{ soc | round(0) }}%→{{ target_soc | round(0) }}%
        {% elif not real_time_ok %}
        ❌ Export: exportable surplus too small ({{ exportable_surplus_w }} W < {{ min_surplus_w }} W) → AcPowerSetPoint = 0
        — solar_now: {{ solar_w | round(0) }} W · load_now: {{ consumption_w | round(0) }} W · min_charge_reserve: {{ min_charge_reserve_w }} W · raw_surplus: {{ raw_surplus_w }} W
        — batt_need: {{ battery_needed_kwh | round(2) }} kWh · hours_left: {{ hours_remaining_day | round(1) }} h
        {% elif feed_in_eligible %}
        ✅ Exp{{ ' [☀️MP]' if morning_priority_active else '' }}: {{ export_w }}W SP={{ -export_w }}W (cap:{{ max_power }}W)
        sol:{{ solar_w|round(0) }} load:{{ consumption_w|round(0) }} res:{{ min_charge_reserve_w }} exp:{{ exportable_surplus_w }}W
        fc:{{ surplus_kwh|round(1) }}kWh buf:{{ morning_surplus_buffer|round(1) }} SOC:{{ soc|round(0) }}→{{ day_charge_target_soc|round(0) }}% need:{{ battery_needed_for_full_kwh|round(1) }}kWh h:{{ hours_remaining_day|round(1) }}
        {% else %}
        ❌ Export: no exportable surplus → AcPowerSetPoint = 0
        — solar_now: {{ solar_w | round(0) }} W · exportable: {{ exportable_surplus_w }} W · min_charge_reserve: {{ min_charge_reserve_w }} W · forecast_surplus: {{ surplus_kwh | round(2) }} kWh
        {% endif %}

  # -------- 2. Write debug log (optional) --------
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ last_reason_text | length > 0 }}"
        sequence:
          - action: input_text.set_value
            target: { entity_id: !input last_reason_text }
            data:
              value: >-
                [{{ now().strftime('%Y-%m-%d %H:%M') }}] → {{ decision_text }}

  # -------- 3. Safety: abort if MQTT topic is not configured --------
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ not topic or topic in ['unknown', 'unavailable'] }}"
        sequence:
          - action: mqtt.publish
            data:
              topic: "homeassistant/log/victron_feed_in"
              payload: "MQTT topic missing; AcPowerSetPoint unchanged"
          - stop: "MQTT topic not configured"

    default:
      # -------- 4. Override: Force FeedIn --------
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ mode == 'Force FeedIn' }}"
            sequence:
              - action: mqtt.publish
                data:
                  topic: "{{ topic }}"
                  payload: >
                    {{ '{"value": ' ~ (-max_power) ~ '}' }}

          # -------- 5. Override: Block FeedIn --------
          - conditions:
              - condition: template
                value_template: "{{ mode == 'Block FeedIn' }}"
            sequence:
              - action: mqtt.publish
                data:
                  topic: "{{ topic }}"
                  payload: '{"value": 0}'

        default:
          # -------- 6. Outside daytime window: do nothing --------
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ not inwin }}"
                sequence:
                  - stop: "Outside daytime window"

            default:
              # -------- 7. Grid import active: stay silent, overnight blueprint controls --------
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ grid_importing }}"
                    sequence:
                      - stop: "Grid import active — overnight blueprint keeps control of AcPowerSetPoint"

                default:
                  # -------- 8. Auto mode --------
                  - choose:
                      # 8a. Battery full (≥99%) + real-time surplus → export, bypass forecast/min-SOC
                      #     export_w = min(solar−load, max_power) → AcSP = −max_power exakt.
                      #     AcSP ≤ −max_power: ESS kann Solar curtailen → folgt Setpoint.
                      #     AcSP > −max_power (alter Bug): ESS kann nicht curtailen → überschreitet MaxFeedInPower.
                      - conditions:
                          - condition: template
                            value_template: "{{ battery_full and real_time_ok and max_power > 0 }}"
                        sequence:
                          - action: mqtt.publish
                            data:
                              topic: "{{ topic }}"
                              payload: >
                                {{ '{"value": ' ~ (-export_w) ~ '}' }}

                      # 8b. Normal: all gates pass → export surplus capped by MaxFeedInPower
                      - conditions:
                          - condition: template
                            value_template: "{{ feed_in_eligible }}"
                        sequence:
                          - action: mqtt.publish
                            data:
                              topic: "{{ topic }}"
                              payload: >
                                {{ '{"value": ' ~ (-export_w) ~ '}' }}

                    # 8c. No surplus or gates blocked → balanced
                    default:
                      - action: mqtt.publish
                        data:
                          topic: "{{ topic }}"
                          payload: '{"value": 0}'
