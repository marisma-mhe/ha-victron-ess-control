#
# ═══════════════════════════════════════════════════════════════════════════
# Victron MQTT Keep-Alive — Blueprint
# ═══════════════════════════════════════════════════════════════════════════
#
# PURPOSE
#   VenusOS stops publishing on victron/N/…-topics if no read-request
#   arrives within ~60 seconds. This blueprint sends an empty request every
#   30 seconds so VenusOS keeps publishing data.
#
#   Create one automation instance per Victron system (GX device).
#
# MQTT REQUEST
#   Topic:   victron/R/<portal_id>/system/0/serial
#   Payload: {}
#   QoS:     0  (next keepalive arrives within 30 s, well within the
#                60 s VenusOS timeout)
#
# ═══════════════════════════════════════════════════════════════════════════

blueprint:
  name: Victron MQTT Keep-Alive
  description: >
    Sends a read-request to VenusOS every 30 seconds so the Victron system
    keeps publishing data on MQTT. Without this, VenusOS stops publishing after
    ~60 seconds of inactivity. Create one automation instance per Victron system.
  domain: automation
  source_url: https://github.com/marisma-mhe/ha-victron-ess-control/blob/main/blueprints/automation/victron/victron_mqtt_keepalive.yaml

  input:
    portal_id:
      name: Victron Portal ID
      description: >
        Hexadecimal portal/device ID of the Victron system (no slashes).
        Find it in VRM Portal → Installation → Device List, or in the MQTT
        topic victron/N/<portal_id>/… Example: a1b2c3d4ef56
      selector:
        text:

mode: single

variables:
  portal_id: !input portal_id

trigger:
  - platform: time_pattern
    seconds: "/30"

action:
  - action: mqtt.publish
    data:
      topic: "victron/R/{{ portal_id }}/system/0/serial"
      payload: "{}"
