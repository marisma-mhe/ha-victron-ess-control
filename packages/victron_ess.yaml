# ═══════════════════════════════════════════════════════════════════════════════
# Victron ESS Control — HA Package
# https://github.com/marisma-mhe/ha-victron-ess-control
# ═══════════════════════════════════════════════════════════════════════════════
#
# SETUP: Enter your Victron portal device IDs below.
# Find them in VRM Portal → Installation → Device List → GX Device.
#
# Single-system setup: set both IDs to the same value.
# Dual-system (grid + consumer): set each to the respective GX device serial.
#
# After installation, add this line to configuration.yaml:
#   homeassistant:
#     packages:
#       victron_ess: !include packages/victron_ess.yaml
# ═══════════════════════════════════════════════════════════════════════════════

# ── System Identity ────────────────────────────────────────────────────────────

input_text:
  victron_grid_system_id:
    name: "Victron Grid System ID (portal serial)"
    max: 32
    icon: mdi:identifier

  victron_consumer_system_id:
    name: "Victron Consumer System ID (portal serial)"
    max: 32
    icon: mdi:identifier

  victron_feed_in_last_reason:
    name: "Victron Feed-In Log"
    max: 255

  victron_max_feed_in_last_reason:
    name: "MaxFeedIn Log"
    max: 255

  victron_last_reason:
    name: "Victron Log"
    max: 255

  storm_forecast_condition:
    name: "Storm: Weather Condition Tomorrow"
    max: 50
    icon: mdi:weather-cloudy

# ── Numeric Parameters ─────────────────────────────────────────────────────────

input_number:
  battery_capacity_kwh:
    name: Battery capacity (kWh)
    min: 5
    max: 200
    step: 1
    unit_of_measurement: "kWh"
    icon: mdi:battery

  charge_efficiency:
    name: Charge efficiency
    min: 0.80
    max: 1.00
    step: 0.01
    unit_of_measurement: "x"
    icon: mdi:battery-heart-outline

  victron_charge_power:
    min: 500
    max: 10000
    step: 100

  victron_soc_floor:
    min: 5
    max: 50
    step: 1

  victron_target_soc_normal:
    min: 20
    max: 100
    step: 1

  victron_target_soc_storm:
    min: 20
    max: 100
    step: 1

  victron_storm_threshold:
    min: 0.5
    max: 6
    step: 0.1

  victron_feed_in_min_soc:
    name: "Feed-In Minimum SOC (%)"
    min: 20
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-arrow-up

  victron_feed_in_min_solar_remaining:
    name: "Feed-In Minimum Solar Remaining (kWh)"
    min: 0
    max: 50
    step: 0.5
    unit_of_measurement: "kWh"
    icon: mdi:sun-clock

  victron_feed_in_min_surplus_w:
    name: "Feed-In Minimum Surplus (W)"
    min: 0
    max: 5000
    step: 50
    unit_of_measurement: "W"
    icon: mdi:lightning-bolt-circle

  victron_feed_in_min_charge_w:
    name: "Feed-In Minimum Battery Charge (W)"
    min: 0
    max: 5000
    step: 50
    unit_of_measurement: "W"
    icon: mdi:battery-charging-low

  victron_feed_in_day_charge_target_soc:
    name: "Feed-In Daily Full Charge Target (%)"
    min: 50
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-arrow-up-outline

  victron_feed_in_morning_surplus_buffer_kwh:
    name: "Feed-In: Min Forecast Buffer for Morning Priority (kWh)"
    min: 0
    max: 20
    step: 0.5
    unit_of_measurement: "kWh"
    icon: mdi:shield-sun

  victron_max_feed_in_power_manual:
    name: "MaxFeedIn Maximum (W)"
    min: 0
    max: 10000
    step: 100
    unit_of_measurement: "W"
    icon: mdi:flash

  victron_max_feed_in_volt_min:
    name: "MaxFeedIn Under-Voltage Threshold (V)"
    min: 220
    max: 248
    step: 0.5
    unit_of_measurement: "V"
    icon: mdi:sine-wave

  victron_max_feed_in_volt_max:
    name: "MaxFeedIn Over-Voltage Threshold (V)"
    min: 235
    max: 260
    step: 0.5
    unit_of_measurement: "V"
    icon: mdi:alert-circle-outline

  victron_max_feed_in_steps:
    name: "MaxFeedIn Number of Steps"
    min: 2
    max: 20
    step: 1
    unit_of_measurement: ""
    icon: mdi:stairs

  victron_max_feed_in_curve_exponent:
    name: "MaxFeedIn: Curve Exponent"
    min: 0.2
    max: 3.0
    step: 0.05
    icon: mdi:chart-bell-curve
    unit_of_measurement: ""

  victron_max_feed_in_dwell_seconds:
    name: "MaxFeedIn: Dwell Time Before Step Change (s)"
    min: 0
    max: 60
    step: 1
    icon: mdi:timer-outline
    unit_of_measurement: "s"

  victron_desired_eod_tomorrow:
    name: Desired EOD SOC Tomorrow (%)
    min: 20
    max: 100
    step: 1
    unit_of_measurement: "%"
    initial: 60

  storm_auto_precip_probability_threshold:
    name: "Storm: Rain Probability Threshold (%)"
    min: 30
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:water-percent

  storm_auto_precip_mm_threshold:
    name: "Storm: Precipitation Threshold (mm)"
    min: 0
    max: 20
    step: 1
    unit_of_measurement: "mm"
    icon: mdi:weather-rainy

  storm_forecast_precip_prob:
    name: "Storm: Rain Probability Tomorrow (%)"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-percent

  storm_forecast_precip_mm:
    name: "Storm: Precipitation Tomorrow (mm)"
    min: 0
    max: 200
    step: 0.1
    unit_of_measurement: "mm"
    icon: mdi:weather-pouring

# ── Flags & Overrides ──────────────────────────────────────────────────────────

input_boolean:
  storm_mode:

  storm_mode_auto_enabled:
    name: "Storm: Auto Detection Active"
    icon: mdi:robot

  storm_mode_manual_override:
    name: "Storm: Manual Override"
    icon: mdi:hand-back-right

  victron_feed_in_morning_priority:
    name: "Feed-In: Prioritize Morning Export"
    icon: mdi:weather-sunny-alert

  victron_ess_source_direct_mqtt:
    name: "Victron ESS: Direct MQTT Source"
    icon: mdi:swap-horizontal

# ── Time Windows ───────────────────────────────────────────────────────────────

input_datetime:
  victron_night_start:
    has_date: false
    has_time: true
  victron_night_end:
    has_date: false
    has_time: true
  victron_day_start:
    has_date: false
    has_time: true
  victron_day_end:
    has_date: false
    has_time: true

# ── Override Selectors ─────────────────────────────────────────────────────────

input_select:
  victron_charge_override:
    name: Lade-Override
    options:
      - Auto
      - Force Charge
      - Block Charge

  victron_feed_in_override:
    name: Feed-In Override
    options:
      - Auto
      - Force FeedIn
      - Block FeedIn

  victron_max_feed_in_override:
    name: MaxFeedIn Override
    options:
      - Auto
      - Manual
      - Unlimited
    icon: mdi:transmission-tower-export

# ── Direct MQTT Source Sensors (swap-points for template adapters) ─────────────
# These sensors use hardcoded serial IDs in state_topic (HA limitation: topic
# is a static string, no Jinja2). Replace the serial IDs with your own values
# from Victron VRM → Installation → Device List → GX Device.
#
# <YOUR_GRID_SYSTEM_ID>     = grid system serial    ← replace with your value
# <YOUR_CONSUMER_SYSTEM_ID> = consumer system serial ← replace with your value
#   (single-system: use the same serial for both)
#
# See docs/mqtts_victron_sample.yaml for sensors that require manual addition
# (MaxFeedInPower + Grid Voltage) because they vary per installation.

mqtt:
  sensor:
    # ── Grid ──────────────────────────────────────────────────────────────────
    - name: "Victron Src Grid Power"
      unique_id: "victron_src_grid_power"
      device_class: power
      state_class: measurement
      state_topic: "victron/N/<YOUR_GRID_SYSTEM_ID>/grid/30/Ac/Power"
      value_template: '{{ value_json.value | float(0) | round(0) | int }}'
      unit_of_measurement: "W"
      icon: mdi:transmission-tower

    - name: "Victron Src Grid Voltage"
      unique_id: "victron_src_grid_voltage"
      device_class: voltage
      state_class: measurement
      state_topic: "victron/N/<YOUR_GRID_SYSTEM_ID>/grid/30/Ac/L1/Voltage"
      value_template: '{{ value_json.value | float(0) | round(1) }}'
      unit_of_measurement: "V"
      icon: mdi:sine-wave

    - name: "Victron Src Grid Current"
      unique_id: "victron_src_grid_current"
      device_class: current
      state_class: measurement
      state_topic: "victron/N/<YOUR_GRID_SYSTEM_ID>/grid/30/Ac/L1/Current"
      value_template: '{{ value_json.value | float(0) | round(2) }}'
      unit_of_measurement: "A"
      icon: mdi:current-ac

    - name: "Victron Src Grid Max Feed In Power"
      unique_id: "victron_src_grid_max_feed_in_power"
      device_class: power
      state_topic: "victron/N/<YOUR_GRID_SYSTEM_ID>/settings/0/Settings/CGwacs/MaxFeedInPower"
      value_template: '{{ value_json.value | float(0) | round(0) }}'
      unit_of_measurement: "W"
      icon: mdi:power

    - name: "Victron Src Grid Energy Export"
      unique_id: "victron_src_grid_energy_export"
      device_class: energy
      state_class: total_increasing
      state_topic: "victron/N/<YOUR_GRID_SYSTEM_ID>/grid/30/Ac/Energy/Reverse"
      value_template: '{{ value_json.value | float(0) | round(3) }}'
      unit_of_measurement: "kWh"
      icon: mdi:lightning-bolt

    # ── Battery ───────────────────────────────────────────────────────────────
    - name: "Victron Src Battery Power"
      unique_id: "victron_src_battery_power"
      device_class: power
      state_class: measurement
      state_topic: "victron/N/<YOUR_GRID_SYSTEM_ID>/system/0/Dc/Battery/Power"
      value_template: '{{ value_json.value | float(0) | round(0) | int }}'
      unit_of_measurement: "W"
      icon: mdi:battery-charging

    - name: "Victron Src Battery Voltage"
      unique_id: "victron_src_battery_voltage"
      device_class: voltage
      state_class: measurement
      state_topic: "victron/N/<YOUR_GRID_SYSTEM_ID>/system/0/Dc/Battery/Voltage"
      value_template: '{{ value_json.value | float(0) | round(1) }}'
      unit_of_measurement: "V"
      icon: mdi:battery

    - name: "Victron Src Battery Current"
      unique_id: "victron_src_battery_current"
      device_class: current
      state_class: measurement
      state_topic: "victron/N/<YOUR_GRID_SYSTEM_ID>/system/0/Dc/Battery/Current"
      value_template: '{{ value_json.value | float(0) | round(1) }}'
      unit_of_measurement: "A"
      icon: mdi:current-dc

    - name: "Victron Src Battery Soc"
      unique_id: "victron_src_battery_soc"
      device_class: battery
      state_class: measurement
      state_topic: "victron/N/<YOUR_GRID_SYSTEM_ID>/system/0/Dc/Battery/Soc"
      value_template: '{{ value_json.value | float(0) | round(0) | int }}'
      unit_of_measurement: "%"
      icon: mdi:battery

    - name: "Victron Src Battery Temperature"
      unique_id: "victron_src_battery_temperature"
      device_class: temperature
      state_class: measurement
      state_topic: "victron/N/<YOUR_GRID_SYSTEM_ID>/system/0/Dc/Battery/Temperature"
      value_template: '{{ value_json.value | float(0) | round(1) }}'
      unit_of_measurement: "°C"
      icon: mdi:thermometer

    # ── Solar ─────────────────────────────────────────────────────────────────
    - name: "Victron Src Solar Power"
      unique_id: "victron_src_solar_power"
      device_class: power
      state_class: measurement
      state_topic: "victron/N/<YOUR_GRID_SYSTEM_ID>/system/0/Dc/Pv/Power"
      value_template: '{{ value_json.value | float(0) | round(0) | int }}'
      unit_of_measurement: "W"
      icon: mdi:solar-power

    # ── Consumer Load ─────────────────────────────────────────────────────────
    - name: "Victron Src Consumer Load Grid"
      unique_id: "victron_src_consumer_load_grid"
      device_class: power
      state_class: measurement
      state_topic: "victron/N/<YOUR_GRID_SYSTEM_ID>/system/0/Ac/Consumption/L1/Power"
      value_template: '{{ value_json.value | float(0) | round(0) | int }}'
      unit_of_measurement: "W"
      icon: mdi:power-socket-uk

    - name: "Victron Src Consumer Load P1"
      unique_id: "victron_src_consumer_load_p1"
      device_class: power
      state_class: measurement
      state_topic: "victron/N/<YOUR_CONSUMER_SYSTEM_ID>/system/0/Ac/Consumption/L1/Power"
      value_template: '{{ value_json.value | float(0) | round(0) | int }}'
      unit_of_measurement: "W"
      icon: mdi:power-socket-uk

    - name: "Victron Src Consumer Load P2"
      unique_id: "victron_src_consumer_load_p2"
      device_class: power
      state_class: measurement
      state_topic: "victron/N/<YOUR_CONSUMER_SYSTEM_ID>/system/0/Ac/Consumption/L2/Power"
      value_template: '{{ value_json.value | float(0) | round(0) | int }}'
      unit_of_measurement: "W"
      icon: mdi:power-socket-uk

    - name: "Victron Src Consumer Load P3"
      unique_id: "victron_src_consumer_load_p3"
      device_class: power
      state_class: measurement
      state_topic: "victron/N/<YOUR_CONSUMER_SYSTEM_ID>/system/0/Ac/Consumption/L3/Power"
      value_template: '{{ value_json.value | float(0) | round(0) | int }}'
      unit_of_measurement: "W"
      icon: mdi:power-socket-uk

# ── Canonical Template Adapter Sensors (sensor.victron_ess_*) ─────────────────
# Stable entity IDs that abstract over the source layer.
# Switch: input_boolean.victron_ess_source_direct_mqtt
#   on  → sensor.victron_src_*  (direct MQTT above)
#   off → sensor.victron_mqtt_<serial>_* (victron_mqtt integration)

template:
  - sensor:

    # ── Grid Power ─────────────────────────────────────────────────────────────
    - name: "victron_ess_grid_power"
      unique_id: "victron_ess_grid_power"
      device_class: power
      state_class: measurement
      unit_of_measurement: "W"
      state: >
        {% if is_state('input_boolean.victron_ess_source_direct_mqtt', 'on') %}
        {{ states('sensor.victron_src_grid_power') | float(0) | round(0) | int }}
        {% else %}
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_grid_30_grid_power') | float(0) | round(0) | int }}
        {% endif %}
      availability: >
        {% if is_state('input_boolean.victron_ess_source_direct_mqtt', 'on') %}
        {{ states('sensor.victron_src_grid_power') | is_number }}
        {% else %}
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_grid_30_grid_power') | is_number }}
        {% endif %}

    # ── Grid Voltage ───────────────────────────────────────────────────────────
    - name: "victron_ess_grid_voltage"
      unique_id: "victron_ess_grid_voltage"
      device_class: voltage
      state_class: measurement
      unit_of_measurement: "V"
      state: >
        {% if is_state('input_boolean.victron_ess_source_direct_mqtt', 'on') %}
        {{ states('sensor.victron_src_grid_voltage') | float(0) | round(1) }}
        {% else %}
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_grid_30_grid_voltage') | float(0) | round(1) }}
        {% endif %}
      availability: >
        {% if is_state('input_boolean.victron_ess_source_direct_mqtt', 'on') %}
        {{ states('sensor.victron_src_grid_voltage') | is_number }}
        {% else %}
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_grid_30_grid_voltage') | is_number }}
        {% endif %}

    # ── Meter Voltage (alias of grid voltage) ──────────────────────────────────
    - name: "victron_ess_meter_voltage"
      unique_id: "victron_ess_meter_voltage"
      device_class: voltage
      state_class: measurement
      unit_of_measurement: "V"
      state: >
        {% if is_state('input_boolean.victron_ess_source_direct_mqtt', 'on') %}
        {{ states('sensor.victron_src_grid_voltage') | float(0) | round(1) }}
        {% else %}
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_grid_30_grid_voltage') | float(0) | round(1) }}
        {% endif %}
      availability: >
        {% if is_state('input_boolean.victron_ess_source_direct_mqtt', 'on') %}
        {{ states('sensor.victron_src_grid_voltage') | is_number }}
        {% else %}
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_grid_30_grid_voltage') | is_number }}
        {% endif %}

    # ── Meter Current ──────────────────────────────────────────────────────────
    - name: "victron_ess_meter_current"
      unique_id: "victron_ess_meter_current"
      device_class: current
      state_class: measurement
      unit_of_measurement: "A"
      state: >
        {% if is_state('input_boolean.victron_ess_source_direct_mqtt', 'on') %}
        {{ states('sensor.victron_src_grid_current') | float(0) | round(2) }}
        {% else %}
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_grid_30_grid_current') | float(0) | round(2) }}
        {% endif %}
      availability: >
        {% if is_state('input_boolean.victron_ess_source_direct_mqtt', 'on') %}
        {{ states('sensor.victron_src_grid_current') | is_number }}
        {% else %}
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_grid_30_grid_current') | is_number }}
        {% endif %}

    # ── Max Feed-In Power (No-Op: CGwacs settings not in integration → always MQTT) ──
    - name: "victron_ess_max_feed_in_power"
      unique_id: "victron_ess_max_feed_in_power"
      device_class: power
      unit_of_measurement: "W"
      state: >
        {{ states('sensor.victron_src_grid_max_feed_in_power') | float(0) | round(0) | int }}
      availability: "{{ states('sensor.victron_src_grid_max_feed_in_power') | is_number }}"

    # ── Expected Max Feed-In Power (voltage-curve derived) ─────────────────────
    - name: "victron_ess_expected_max_feed_in_power"
      unique_id: "victron_ess_expected_max_feed_in_power"
      device_class: power
      unit_of_measurement: "W"
      state: >
        {% set v = states('sensor.victron_ess_grid_voltage') | float(0) %}
        {% set mode = states('input_select.victron_max_feed_in_override') %}
        {% set max_p = states('input_number.victron_max_feed_in_power_manual') | int(5000) %}
        {% set v_min = states('input_number.victron_max_feed_in_volt_min') | float(235) %}
        {% set v_max = states('input_number.victron_max_feed_in_volt_max') | float(250) %}
        {% set n = states('input_number.victron_max_feed_in_steps') | int(10) %}
        {% if mode in ['Manual', 'Unlimited'] %}
        {{ max_p }}
        {% elif v >= v_max %}
        0
        {% elif v < v_min %}
        {{ max_p }}
        {% else %}
        {% set step_v = (v_max - v_min) / n %}
        {% set s = [((v_max - v) / step_v) | round(0, 'ceil') | int, n] | min %}
        {% set exp = states('input_number.victron_max_feed_in_curve_exponent') | float(1.0) %}
        {{ ((s / n) ** exp * max_p) | int }}
        {% endif %}
      availability: "{{ states('sensor.victron_ess_grid_voltage') | is_number }}"

    # ── Grid Energy Export ─────────────────────────────────────────────────────
    - name: "victron_ess_grid_energy_reverse"
      unique_id: "victron_ess_grid_energy_reverse"
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: "kWh"
      state: >
        {% if is_state('input_boolean.victron_ess_source_direct_mqtt', 'on') %}
        {{ states('sensor.victron_src_grid_energy_export') | float(0) | round(3) }}
        {% else %}
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_grid_30_grid_energy_reverse') | float(0) | round(3) }}
        {% endif %}
      availability: >
        {% if is_state('input_boolean.victron_ess_source_direct_mqtt', 'on') %}
        {{ states('sensor.victron_src_grid_energy_export') | is_number }}
        {% else %}
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_grid_30_grid_energy_reverse') | is_number }}
        {% endif %}

    # ── Battery Power ──────────────────────────────────────────────────────────
    - name: "victron_ess_battery_power"
      unique_id: "victron_ess_battery_power"
      device_class: power
      state_class: measurement
      unit_of_measurement: "W"
      state: >
        {% if is_state('input_boolean.victron_ess_source_direct_mqtt', 'on') %}
        {{ states('sensor.victron_src_battery_power') | float(0) | round(0) | int }}
        {% else %}
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_battery_512_battery_power') | float(0) | round(0) | int }}
        {% endif %}
      availability: >
        {% if is_state('input_boolean.victron_ess_source_direct_mqtt', 'on') %}
        {{ states('sensor.victron_src_battery_power') | is_number }}
        {% else %}
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_battery_512_battery_power') | is_number }}
        {% endif %}

    # ── Battery Voltage ────────────────────────────────────────────────────────
    - name: "victron_ess_battery_voltage"
      unique_id: "victron_ess_battery_voltage"
      device_class: voltage
      state_class: measurement
      unit_of_measurement: "V"
      state: >
        {% if is_state('input_boolean.victron_ess_source_direct_mqtt', 'on') %}
        {{ states('sensor.victron_src_battery_voltage') | float(0) | round(1) }}
        {% else %}
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_battery_512_battery_voltage') | float(0) | round(1) }}
        {% endif %}
      availability: >
        {% if is_state('input_boolean.victron_ess_source_direct_mqtt', 'on') %}
        {{ states('sensor.victron_src_battery_voltage') | is_number }}
        {% else %}
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_battery_512_battery_voltage') | is_number }}
        {% endif %}

    # ── Battery Current ────────────────────────────────────────────────────────
    - name: "victron_ess_battery_current"
      unique_id: "victron_ess_battery_current"
      device_class: current
      state_class: measurement
      unit_of_measurement: "A"
      state: >
        {% if is_state('input_boolean.victron_ess_source_direct_mqtt', 'on') %}
        {{ states('sensor.victron_src_battery_current') | float(0) | round(1) }}
        {% else %}
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_battery_512_battery_current') | float(0) | round(1) }}
        {% endif %}
      availability: >
        {% if is_state('input_boolean.victron_ess_source_direct_mqtt', 'on') %}
        {{ states('sensor.victron_src_battery_current') | is_number }}
        {% else %}
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_battery_512_battery_current') | is_number }}
        {% endif %}

    # ── Battery SOC ────────────────────────────────────────────────────────────
    - name: "victron_ess_battery_soc"
      unique_id: "victron_ess_battery_soc"
      device_class: battery
      state_class: measurement
      unit_of_measurement: "%"
      state: >
        {% if is_state('input_boolean.victron_ess_source_direct_mqtt', 'on') %}
        {{ states('sensor.victron_src_battery_soc') | float(0) | round(0) | int }}
        {% else %}
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_battery_512_battery_soc') | float(0) | round(0) | int }}
        {% endif %}
      availability: >
        {% if is_state('input_boolean.victron_ess_source_direct_mqtt', 'on') %}
        {{ states('sensor.victron_src_battery_soc') | is_number }}
        {% else %}
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_battery_512_battery_soc') | is_number }}
        {% endif %}

    # ── Battery Temperature ────────────────────────────────────────────────────
    - name: "victron_ess_battery_temperature"
      unique_id: "victron_ess_battery_temperature"
      device_class: temperature
      state_class: measurement
      unit_of_measurement: "°C"
      state: >
        {% if is_state('input_boolean.victron_ess_source_direct_mqtt', 'on') %}
        {{ states('sensor.victron_src_battery_temperature') | float(0) | round(1) }}
        {% else %}
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_battery_512_battery_temperature') | float(0) | round(1) }}
        {% endif %}
      availability: >
        {% if is_state('input_boolean.victron_ess_source_direct_mqtt', 'on') %}
        {{ states('sensor.victron_src_battery_temperature') | is_number }}
        {% else %}
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_battery_512_battery_temperature') | is_number }}
        {% endif %}

    # ── Solar Power ────────────────────────────────────────────────────────────
    - name: "victron_ess_solar_power"
      unique_id: "victron_ess_solar_power"
      device_class: power
      state_class: measurement
      unit_of_measurement: "W"
      state: >
        {% if is_state('input_boolean.victron_ess_source_direct_mqtt', 'on') %}
        {{ states('sensor.victron_src_solar_power') | float(0) | round(0) | int }}
        {% else %}
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_system_0_system_dc_pv_power') | float(0) | round(0) | int }}
        {% endif %}
      availability: >
        {% if is_state('input_boolean.victron_ess_source_direct_mqtt', 'on') %}
        {{ states('sensor.victron_src_solar_power') | is_number }}
        {% else %}
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_system_0_system_dc_pv_power') | is_number }}
        {% endif %}

    # ── Solar Yield Today (No-Op: MQTT paths unverified → always integration) ──
    # NOTE: Solarcharger instance IDs (0, 1, 277, 278, 279) are installation-specific.
    # Check your own via VRM or ha-victron-mqtt entity list. Single-MPPT: instance 0 only.
    - name: "victron_ess_solar_yield_today"
      unique_id: "victron_ess_solar_yield_today"
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: "kWh"
      state: >
        {{ (states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_solarcharger_0_solarcharger_yield_today') | float(0)
          + states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_solarcharger_1_solarcharger_yield_today') | float(0)
          + states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_solarcharger_277_solarcharger_yield_today') | float(0)
          + states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_solarcharger_278_solarcharger_yield_today') | float(0)
          + states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_solarcharger_279_solarcharger_yield_today') | float(0)) | round(3) }}
      availability: >
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_solarcharger_0_solarcharger_yield_today') | is_number }}

    # ── Solar Yield Yesterday (No-Op: MQTT paths unverified → always integration) ─
    # NOTE: Adapt solarcharger instance IDs to match your installation (see above).
    - name: "victron_ess_solar_yield_yesterday"
      unique_id: "victron_ess_solar_yield_yesterday"
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: "kWh"
      state: >
        {{ (states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_solarcharger_0_solarcharger_yield_yesterday') | float(0)
          + states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_solarcharger_1_solarcharger_yield_yesterday') | float(0)
          + states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_solarcharger_277_solarcharger_yield_yesterday') | float(0)
          + states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_solarcharger_278_solarcharger_yield_yesterday') | float(0)
          + states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_solarcharger_279_solarcharger_yield_yesterday') | float(0)) | round(3) }}
      availability: >
        {{ states('sensor.victron_mqtt_' + states('input_text.victron_grid_system_id') + '_solarcharger_0_solarcharger_yield_yesterday') | is_number }}

    # ── Consumer Load 3f (No-Op: integration unavailable → always MQTT) ────────
    - name: "victron_ess_consumer_system_load"
      unique_id: "victron_ess_consumer_system_load"
      device_class: power
      state_class: measurement
      unit_of_measurement: "W"
      state: >
        {% set p1 = states('sensor.victron_src_consumer_load_p1') | float(0) %}
        {% set p2 = states('sensor.victron_src_consumer_load_p2') | float(0) %}
        {% set p3 = states('sensor.victron_src_consumer_load_p3') | float(0) %}
        {{ (p1 + p2 + p3) | round(0) | int }}
      availability: >
        {{ not 'unavailable' in [
             states('sensor.victron_src_consumer_load_p1'),
             states('sensor.victron_src_consumer_load_p2'),
             states('sensor.victron_src_consumer_load_p3') ] }}

    # ── Consumer Load 1f (No-Op: integration unavailable → always MQTT) ────────
    - name: "victron_ess_grid_system_load"
      unique_id: "victron_ess_grid_system_load"
      device_class: power
      state_class: measurement
      unit_of_measurement: "W"
      state: >
        {{ states('sensor.victron_src_consumer_load_grid') | float(0) | round(0) | int }}
      availability: "{{ states('sensor.victron_src_consumer_load_grid') | is_number }}"

# ── Utility Meters ─────────────────────────────────────────────────────────────

utility_meter:
  victron_consumer_load_day:
    source: sensor.total_power_grid_consumer_consuming_integral
    cycle: daily

  victron_pv_yield_month:
    source: sensor.victron_ess_solar_yield_today
    cycle: monthly

  victron_grid_import_kwh:
    source: sensor.victron_grid_import_power
    cycle: monthly

  victron_grid_export_kwh:
    source: sensor.victron_grid_export_power
    cycle: monthly

  victron_grid_import_day:
    source: sensor.victron_grid_import_power
    cycle: daily

  victron_grid_export_day:
    source: sensor.victron_grid_export_power
    cycle: daily

  victron_feed_in_today:
    source: sensor.victron_ess_grid_energy_reverse
    cycle: daily

  victron_battery_charge_kwh:
    source: sensor.victron_battery_charge_power
    cycle: monthly

  victron_battery_discharge_kwh:
    source: sensor.victron_battery_discharge_power
    cycle: monthly

  victron_battery_charge_day:
    source: sensor.victron_battery_charge_power
    cycle: daily

  victron_battery_discharge_day:
    source: sensor.victron_battery_discharge_power
    cycle: daily
